# CPU by default (works without a GPU). Language: PAWMATCH_LANG=en|ja
services:
  prepare:
    build: .
    command: ["prepare-data"]
    environment: [PAWMATCH_LANG=${PAWMATCH_LANG:-en}]
    volumes: ["./data:/app/data"]
  train:
    build: .
    command: ["train", "--config", "configs/classification.yaml"]
    environment: [PAWMATCH_LANG=${PAWMATCH_LANG:-en}]
    volumes: ["./data:/app/data", "./runs:/app/runs", "./configs:/app/configs"]
  app:
    # Demo web app (no authentication). Needs trained weights: set the run paths in
    # configs/pipeline.yaml; ./runs is mounted read-only.
    build: .
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    environment: [PAWMATCH_LANG=${PAWMATCH_LANG:-en}]
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./data:/app/data", "./runs:/app/runs:ro", "./configs:/app/configs"]

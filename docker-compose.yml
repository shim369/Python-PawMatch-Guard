# CPU by default (works without a GPU). Language: PAWMATCH_LANG=en|ja
x-aws-local: &aws-local
  PAWMATCH_STORAGE: aws
  PAWMATCH_BUCKET: pawmatch-local
  PAWMATCH_TABLE: pawmatch-posts
  PAWMATCH_S3_ENDPOINT: http://s3:8333
  PAWMATCH_DYNAMODB_ENDPOINT: http://dynamodb:8000
  AWS_ACCESS_KEY_ID: local # emulators only; never reuse for real AWS
  AWS_SECRET_ACCESS_KEY: local
  AWS_DEFAULT_REGION: us-east-1

services:
  prepare:
    build: .
    command: ["prepare-data"]
    environment: ["PAWMATCH_LANG=${PAWMATCH_LANG:-en}"]
    volumes: ["./data:/app/data"]

  train:
    build: .
    command: ["train", "--config", "configs/classification.yaml"]
    environment: ["PAWMATCH_LANG=${PAWMATCH_LANG:-en}"]
    volumes: ["./data:/app/data", "./runs:/app/runs", "./configs:/app/configs"]

  app:
    # Demo web app, SQLite + local files (no authentication). Needs trained weights: set the
    # run paths in configs/pipeline.yaml; ./runs is mounted read-only.
    build: .
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    environment: ["PAWMATCH_LANG=${PAWMATCH_LANG:-en}"]
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./data:/app/data", "./runs:/app/runs:ro", "./configs:/app/configs"]

  # --- `docker compose --profile aws-local up`: the AWS code path, locally --------------
  # S3 -> SeaweedFS (MinIO's official images are no longer pullable), DynamoDB -> DynamoDB
  # Local, Lambda -> FastAPI background task.
  s3:
    profiles: [aws-local]
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data
    ports: ["127.0.0.1:8333:8333"]

  dynamodb:
    profiles: [aws-local]
    image: amazon/dynamodb-local:latest
    command: -jar DynamoDBLocal.jar -inMemory -sharedDb
    ports: ["127.0.0.1:8002:8000"]

  init-aws-local:
    profiles: [aws-local]
    build: .
    entrypoint: ["uv", "run", "--no-sync", "python", "scripts/init_local_aws.py"]
    environment: *aws-local
    volumes: ["./scripts:/app/scripts:ro"]
    depends_on: [s3, dynamodb]

  app-aws-local:
    profiles: [aws-local]
    build: .
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *aws-local
      PAWMATCH_LANG: ${PAWMATCH_LANG:-en}
    ports: ["127.0.0.1:8001:8000"]
    volumes: ["./runs:/app/runs:ro", "./configs:/app/configs"]
    depends_on: [init-aws-local]

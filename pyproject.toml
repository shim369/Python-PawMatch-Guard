[project]
name = "pawmatch-guard"
version = "0.1.0"
description = "Pet adoption matching app with an AI moderation pipeline (classification, detection, segmentation)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=1.26",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "pyarrow>=26.0.1",
    "opencv-python-headless>=5.0.0.93",
    "fastapi>=0.162.7",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.33",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pycocotools>=2.0.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "scikit-learn>=1.5",
    "torchmetrics>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
pawmatch = "src.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ t('app.title') }}</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;color:#222;background:#faf8f5}
 header{background:#2d4a3e;color:#fff;padding:.7rem 1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
 header a{color:#fff;text-decoration:none} header .sp{flex:1}
 main{max-width:960px;margin:1rem auto;padding:0 1rem}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}
 .card{background:#fff;border:1px solid #e3ddd3;border-radius:8px;overflow:hidden}
 .card img{width:100%;height:160px;object-fit:cover;display:block}
 .card div{padding:.6rem} .muted{color:#777;font-size:.85rem}
 input,select,textarea,button{font:inherit;padding:.4rem;margin:.2rem 0}
 label{display:block;margin-top:.6rem} button{cursor:pointer}
 .badge{display:inline-block;padding:.1rem .5rem;border-radius:99px;font-size:.8rem;background:#eee}
</style>
</head>
<body>
<header>
 <strong>🐾 {{ t('app.title') }}</strong>
 <a href="/">{{ t('nav.home') }}</a><a href="/submit">{{ t('nav.submit') }}</a>
 <a href="/review">{{ t('nav.review') }}</a><span class="sp"></span>
 {% for l in langs %}<a href="?lang={{ l }}">{{ l|upper }}</a>{% endfor %}
</header>
<main>{% block body %}{% endblock %}</main>
</body></html>
